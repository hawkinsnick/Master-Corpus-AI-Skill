name: Validate standalone master skill
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -v
  native-members:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Acquire exact public native checkpoints
        run: |
          python - <<'PY'
          from pathlib import Path
          import concurrent.futures,json,re,subprocess
          entries=json.loads(Path('migration/member-checkpoints.json').read_text())['members']
          registry={m['repository'] for m in json.loads(Path('registry/corpus-projects.json').read_text())['members']}
          assert len(entries)==len(registry) and {m['repository'] for m in entries}==registry
          def acquire(m):
              assert re.fullmatch(r'hawkinsnick/[A-Za-z0-9-]+',m['repository'])
              assert re.fullmatch('[a-f0-9]{40}',m['commit'])
              target=Path('.checkouts')/m['repository'].split('/')[-1]
              subprocess.run(['git','clone','--quiet','--no-checkout','https://github.com/'+m['repository']+'.git',str(target)],check=True)
              subprocess.run(['git','checkout','--quiet','--detach',m['commit']],cwd=target,check=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:list(pool.map(acquire,entries))
          PY
      - run: python scripts/validate.py --checkouts .checkouts --output generated/member-validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-member-validation
          path: generated/member-validation.json
  research-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Acquire frozen study inputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import concurrent.futures,json,re,subprocess
          rows=json.loads(Path('research/2026-10-21/native-revisions.json').read_text())['members']
          def acquire(m):
              assert re.fullmatch(r'hawkinsnick/[A-Za-z0-9-]+',m['repository'])
              assert re.fullmatch('[a-f0-9]{40}',m['commit'])
              target=Path('.research-checkouts')/m['repository'].split('/')[-1]
              subprocess.run(['git','clone','--quiet','--no-checkout','https://github.com/'+m['repository']+'.git',str(target)],check=True)
              subprocess.run(['git','checkout','--quiet','--detach',m['commit']],cwd=target,check=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:list(pool.map(acquire,rows))
          PY
      - run: python scripts/research_milestone.py --checkouts .research-checkouts
      - run: python scripts/score_research_pilot.py
      - run: python scripts/provider_source_check.py --checkouts .research-checkouts
      - run: python scripts/scan_source_dependence.py --checkouts .research-checkouts
      - run: python scripts/validate_evaluation_v2.py --checkouts .research-checkouts
      - run: python scripts/check_printed_source_recheck.py --checkouts .research-checkouts
      - run: python scripts/check_source_batch.py --checkouts .research-checkouts
      - run: python scripts/prepare_source_union.py --checkouts .research-checkouts --output research/remediation/cypriot-source-union.json --check

      - run: python scripts/prepare_milyan_union.py --checkouts .research-checkouts --output research/remediation/milyan-source-union.json --check

  scoped-closures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire pinned closure and union inputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import concurrent.futures,json,re,subprocess
          rows=json.loads(Path('research/remediation/closure-control-inputs-2026-10-25.json').read_text())['members']
          assert len(rows)==len({x['repository'] for x in rows})==7
          def acquire(m):
              assert re.fullmatch(r'hawkinsnick/[A-Za-z0-9-]+',m['repository'])
              assert re.fullmatch('[a-f0-9]{40}',m['commit'])
              target=Path('.closure-checkouts')/m['repository'].split('/')[-1]
              subprocess.run(['git','clone','--quiet','--no-checkout','https://github.com/'+m['repository']+'.git',str(target)],check=True)
              subprocess.run(['git','checkout','--quiet','--detach',m['commit']],cwd=target,check=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:list(pool.map(acquire,rows))
          PY
      - run: python scripts/check_scoped_closures.py --checkouts .closure-checkouts

  hostile-review-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Acquire pinned hostile-review inputs
        run: |
          python - <<'PYINNER'
          from pathlib import Path
          import concurrent.futures,json,re,subprocess
          manifest=json.loads(Path('research/2026-10-25/inputs.json').read_text())
          subprocess.run(['git','fetch','--quiet','--depth','1','origin',manifest['master_input_commit']],check=True)
          rows=manifest['members']
          def acquire(m):
              assert re.fullmatch(r'hawkinsnick/[A-Za-z0-9-]+',m['repository'])
              assert re.fullmatch('[a-f0-9]{40}',m['commit'])
              target=Path('.review-checkouts')/m['repository'].split('/')[-1]
              subprocess.run(['git','clone','--quiet','--no-checkout','https://github.com/'+m['repository']+'.git',str(target)],check=True)
              subprocess.run(['git','checkout','--quiet','--detach',m['commit']],cwd=target,check=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:list(pool.map(acquire,rows))
          PYINNER
      - run: python scripts/hostile_review.py --checkouts .review-checkouts
      - run: python scripts/provider_stratum_review.py --checkouts .review-checkouts
      - run: python scripts/score_hostile_development.py --checkouts .review-checkouts
      - run: python scripts/recheck_academic_backlog.py --checkouts .review-checkouts
      - run: python scripts/check_published_appendix_recheck.py --native-root .review-checkouts/Linear-B --receipt research/2026-10-25/linear-b-appendix-recheck.json
      - name: Acquire published verifier snapshots without replacing initial study inputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import concurrent.futures,json,re,subprocess
          rows=json.loads(Path('research/2026-10-25/publication-inputs.json').read_text())['members']
          def acquire(m):
              assert re.fullmatch(r'hawkinsnick/[A-Za-z0-9-]+',m['repository'])
              assert re.fullmatch('[a-f0-9]{40}',m['commit'])
              source=Path('.review-checkouts')/m['repository'].split('/')[-1]
              target=(Path('.publication-checkouts')/m['repository'].split('/')[-1]).resolve()
              if subprocess.run(['git','cat-file','-e',m['commit']+'^{commit}'],cwd=source,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode:
                  subprocess.run(['git','fetch','--quiet','origin',m['commit']],cwd=source,check=True)
              subprocess.run(['git','worktree','add','--quiet','--detach',str(target),m['commit']],cwd=source,check=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:list(pool.map(acquire,rows))
          PY
      - run: python scripts/hostile_review.py --checkouts .publication-checkouts --publication-checkpoints
